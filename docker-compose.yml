name: chimii

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chimii
      POSTGRES_USER: ${POSTGRES_USER:-chimii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chimii}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
