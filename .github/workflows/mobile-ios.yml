name: iOS Test IPA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Backend environment
        type: choice
        default: production
        options: [production, staging]
  push:
    tags: ['ios-test-*']

permissions:
  contents: read

concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install dependencies
        run: |
          mkdir -p apps/mobile/artifacts/ios/logs
          pnpm install --frozen-lockfile 2>&1 | tee apps/mobile/artifacts/ios/logs/install.log
      - name: Verify mobile code and artifact guards
        run: |
          {
            pnpm -C apps/mobile typecheck
            pnpm -C apps/mobile lint
            pnpm -C apps/mobile test
            python3 apps/mobile/scripts/verify-ios-ipa.test.py
          } 2>&1 | tee apps/mobile/artifacts/ios/logs/verify.log
      - name: Build unsigned iPhoneOS IPA
        env:
          APP_ENV: ${{ inputs.environment || 'production' }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm -C apps/mobile ios:unsigned 2>&1 | tee apps/mobile/artifacts/ios/logs/build.log
      - name: Collect diagnostics
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p apps/mobile/artifacts/ios/logs
          printf 'Build status: %s\nSource: %s\nCI: %s\n' "$BUILD_STATUS" "$SOURCE_SHA" "$RUN_URL" > apps/mobile/artifacts/ios/build-status.txt
          cp apps/mobile/docs/ios-testing.md apps/mobile/artifacts/ios/INSTALL.md
          tar -czf apps/mobile/artifacts/ios/build-logs.tar.gz -C apps/mobile/artifacts/ios logs
          rm -rf apps/mobile/artifacts/ios/logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimii-ios-${{ github.run_number }}
          path: apps/mobile/artifacts/ios/*
          if-no-files-found: error
          retention-days: 14

  # A tag push uses the project's existing Git/SSH access; no PAT is required.
  # Only this job can publish. Failed builds expose diagnostics, never an IPA.
  test-release:
    needs: ipa
    if: always() && startsWith(github.ref, 'refs/tags/ios-test-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chimii-ios-${{ github.run_number }}
          path: ios-artifacts
      - name: Publish test package and diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_TAG: ${{ github.ref_name }}
          BUILD_RESULT: ${{ needs.ipa.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$BUILD_RESULT" != success ]]; then
            rm -f ios-artifacts/*.ipa ios-artifacts/*.sha256 ios-artifacts/*.checks.json
          fi
          {
            printf 'iOS device build: **%s**. [Build details](%s).\n\n' "$BUILD_RESULT" "$RUN_URL"
            cat ios-artifacts/INSTALL.md
          } > release-notes.md
          gh release create "$TEST_TAG" ios-artifacts/* --verify-tag --prerelease --latest=false \
            --title "Chimii iOS test — $TEST_TAG" --notes-file release-notes.md
