name: Release

on:
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag name
        id: release_meta
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Triggered by tag: $tag"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Verify sh deployment safeguards
        run: bash scripts/deploy-sh.test.sh

      - name: Run tests
        run: bash scripts/test-go.sh --race

  release:
    needs: verify
    # Only publish from the repository that backs chimii.com/download.
    if: github.repository == 'Dao210/chimii'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the Desktop installers and upload them to the GitHub Release that
  # the release job above just published. Until Apple signing credentials are
  # configured, macOS artifacts are ad-hoc signed and not notarized; the
  # download page labels that limitation explicitly.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish always

  verify-assets:
    needs: [verify, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Verify published CLI and Desktop assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          mapfile -t published_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )

          expected_assets=(
            "checksums.txt"
            "chimii-cli-${version}-darwin-amd64.tar.gz"
            "chimii-cli-${version}-darwin-arm64.tar.gz"
            "chimii-cli-${version}-linux-amd64.tar.gz"
            "chimii-cli-${version}-linux-arm64.tar.gz"
            "chimii-cli-${version}-windows-amd64.zip"
            "chimii-cli-${version}-windows-arm64.zip"
            "chimii-desktop-${version}-mac-arm64.dmg"
            "chimii-desktop-${version}-mac-arm64.zip"
            "chimii-desktop-${version}-mac-x64.dmg"
            "chimii-desktop-${version}-mac-x64.zip"
            "chimii-desktop-${version}-windows-x64.exe"
            "chimii-desktop-${version}-windows-arm64.exe"
            "chimii-desktop-${version}-linux-x86_64.AppImage"
            "chimii-desktop-${version}-linux-amd64.deb"
            "chimii-desktop-${version}-linux-x86_64.rpm"
            "chimii-desktop-${version}-linux-arm64.AppImage"
            "chimii-desktop-${version}-linux-arm64.deb"
            "chimii-desktop-${version}-linux-aarch64.rpm"
          )

          missing_assets=()
          for expected in "${expected_assets[@]}"; do
            found=false
            for published in "${published_assets[@]}"; do
              if [[ "$published" == "$expected" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              missing_assets+=("$expected")
            fi
          done

          if (( ${#missing_assets[@]} > 0 )); then
            printf '::error::Release %s is missing required assets:\n' "$RELEASE_TAG"
            printf '  - %s\n' "${missing_assets[@]}"
            exit 1
          fi

          printf 'Verified %s required release assets for %s.\n' \
            "${#expected_assets[@]}" "$RELEASE_TAG"
